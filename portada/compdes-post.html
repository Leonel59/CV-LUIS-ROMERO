<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>COMPDES 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,520;1,9..144,500&family=Outfit:wght@380;560;680&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1600px; height: 900px; overflow: hidden; }
    .card {
      width: 1600px;
      height: 900px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 72px 88px;
      color: #f6f1e6;
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(680px 320px at 88% 12%, rgba(215, 177, 90, 0.2), transparent 68%),
        radial-gradient(720px 420px at 0% 100%, rgba(46, 111, 168, 0.42), transparent 62%),
        linear-gradient(108deg, #071018 0%, #0c1c2c 55%, #123047 100%);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(246, 241, 230, 0.04) 1px, transparent 1px);
      background-size: 100% 32px;
      pointer-events: none;
    }
    .rule {
      position: absolute;
      left: 88px;
      right: 88px;
      top: 42px;
      height: 1px;
      background: linear-gradient(90deg, rgba(215, 177, 90, 0.95), rgba(215, 177, 90, 0.08));
    }
    .sgi, .ues { position: relative; display: flex; align-items: center; justify-content: center; }
    .sgi img { height: 248px; width: auto; }
    .ues img { height: 340px; width: auto; filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.35)); }
    .mid {
      position: relative;
      text-align: center;
      max-width: 520px;
    }
    .kicker {
      font-size: 18px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d7b15a;
      font-weight: 680;
    }
    h1 {
      margin-top: 16px;
      font-family: "Fraunces", serif;
      font-weight: 520;
      font-size: 78px;
      line-height: 0.92;
      letter-spacing: -0.03em;
    }
    h1 em { font-style: italic; }
    p {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 380;
      line-height: 1.35;
      color: #d5e2ee;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="sgi">
      <img src="sgi.webp" alt="SGI" />
    </div>
    <div class="mid">
      <p class="kicker">El Salvador</p>
      <h1>COMPDES<br><em>2026</em></h1>
      <p>Congreso Iberoamericano de Computación para el Desarrollo</p>
    </div>
    <div class="ues">
      <img src="ues.png" alt="Universidad de El Salvador" />
    </div>
  </div>
</body>
</html>
